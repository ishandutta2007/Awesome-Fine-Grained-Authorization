<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 320"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#311042"/></linearGradient><linearGradient id="card-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)"/><stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)"/></linearGradient><linearGradient id="accent-cyan" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient><linearGradient id="accent-pink" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#ec4899"/><stop offset="100%" stop-color="#8b5cf6"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><style>@keyframes float1{0%{transform:translate(0,0) rotate(0deg)}50%{transform:translate(15px,-15px) rotate(3deg)}}@keyframes float2{0%{transform:translate(0,0) rotate(0deg)}50%{transform:translate(-20px,10px) rotate(-4deg)}}@keyframes glow-pulse{0%{opacity:.4}50%{opacity:.8}}.title{font-weight:800;font-size:46px;fill:#fff}.node-text,.subtitle,.tag,.title{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.subtitle{font-weight:500;font-size:20px;fill:#cbd5e1}.node-text,.tag{font-weight:600}.tag{font-size:13px;fill:#38bdf8;letter-spacing:1.5px;text-transform:uppercase}.node-text{font-size:12px;fill:#f8fafc}.floating-bg-1{animation:float1 8s ease-in-out infinite}.flowing-line{stroke-dasharray:8 8;animation:pulse-dash 2s linear infinite}.glowing-orb{animation:glow-pulse 4s ease-in-out infinite}</style></defs><rect width="1200" height="320" fill="url(#bg-grad)" rx="16"/><circle cx="150" cy="80" r="180" fill="#06b6d4" class="glowing-or