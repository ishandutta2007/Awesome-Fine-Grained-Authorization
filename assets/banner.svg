<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)"/>
    </linearGradient>
    
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    
    <linearGradient id="accent-pink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 46px; fill: #ffffff; }
      .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #cbd5e1; }
      .tag { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #38bdf8; letter-spacing: 1.5px; text-transform: uppercase; }
      .node-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 12px; fill: #f8fafc; }
      
      /* Dynamic Animated Background Elements */
      @keyframes float1 {
        0% { transform: translate(0px, 0px) rotate(0deg); }
        50% { transform: translate(15px, -15px) rotate(3deg); }
        100% { transform: translate(0px, 0px) rotate(0deg); }
      }
      @keyframes float2 {
        0% { transform: translate(0px, 0px) rotate(0deg); }
        50% { transform: translate(-20px, 10px) rotate(-4deg); }
        100% { transform: translate(0px, 0px) rotate(0deg); }
      }
      @keyframes pulse-dash {
        to { stroke-dashoffset: -40; }
      }
      @keyframes glow-pulse {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 0.8; }
      }
      
      .floating-bg-1 { animation: float1 8s ease-in-out infinite; }
      .floating-bg-2 { animation: float2 10s ease-in-out infinite; }
      .flowing-line { stroke-dasharray: 8 8; animation: pulse-dash 2s linear infinite; }
      .glowing-orb { animation: glow-pulse 4s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bg-grad)" />
  
  <!-- Glowing Background Orbs -->
  <circle cx="150" cy="80" r="180" fill="#06b6d4" opacity="0.15" filter="url(#glow)" class="glowing-orb" />
  <circle cx="1050" cy="240" r="200" fill="#8b5cf6" opacity="0.2" filter="url(#glow)" class="glowing-orb" style="animation-delay: 2s;" />

  <!-- Animated Dynamic Background Nodes/Graph (positioned to right & background) -->
  <g class="floating-bg-1" opacity="0.45">
    <line x1="780" y1="90" x2="940" y2="70" stroke="#38bdf8" stroke-width="2" class="flowing-line" />
    <line x1="940" y1="70" x2="1080" y2="130" stroke="#818cf8" stroke-width="2" />
    <line x1="780" y1="90" x2="880" y2="190" stroke="#c084fc" stroke-width="2" />
    <line x1="880" y1="190" x2="1080" y2="130" stroke="#38bdf8" stroke-width="2" class="flowing-line" />
    
    <!-- Tuple Nodes -->
    <g transform="translate(780, 90)">
      <rect x="-45" y="-18" width="90" height="36" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
      <text class="node-text" text-anchor="middle" dy="4">User:Alice</text>
    </g>
    <g transform="translate(940, 70)">
      <rect x="-50" y="-18" width="100" height="36" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" />
      <text class="node-text" text-anchor="middle" dy="4">relation:writer</text>
    </g>
    <g transform="translate(1080, 130)">
      <rect x="-55" y="-18" width="110" height="36" rx="8" fill="#1e293b" stroke="#c084fc" stroke-width="1.5" />
      <text class="node-text" text-anchor="middle" dy="4">Doc:Roadmap</text>
    </g>
    <g transform="translate(880, 190)">
      <rect x="-45" y="-18" width="90" height="36" rx="8" fill="#1e293b" stroke="#f472b6" stroke-width="1.5" />
      <text class="node-text" text-anchor="middle" dy="4">Check: OK</text>
    </g>
  </g>

  <!-- Foreground Title and Content Block (Ensured clear & unhidden) -->
  <g transform="translate(70, 0)">
    <!-- Category Pill -->
    <g transform="translate(0, 55)">
      <rect width="280" height="28" rx="14" fill="url(#card-grad)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
      <text x="14" y="18" class="tag">🔐 Relationship-Based Access Control</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="135" class="title">
      Awesome Fine-Grained Authorization
    </text>

    <!-- Subtitle -->
    <text x="0" y="175" class="subtitle">
      ReBAC • Google Zanzibar Systems • Policy-as-Code • Resource Authorization
    </text>

    <!-- Visual Feature Badges in Banner -->
    <g transform="translate(0, 215)">
      <!-- Badge 1 -->
      <g transform="translate(0, 0)">
        <rect width="160" height="38" rx="10" fill="url(#card-grad)" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
        <circle cx="22" cy="19" r="6" fill="#10b981" />
        <text x="36" y="24" font-family="system-ui" font-size="13" font-weight="600" fill="#e2e8f0">SaaS Platforms</text>
      </g>
      <!-- Badge 2 -->
      <g transform="translate(175, 0)">
        <rect width="185" height="38" rx="10" fill="url(#card-grad)" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
        <circle cx="22" cy="19" r="6" fill="#3b82f6" />
        <text x="36" y="24" font-family="system-ui" font-size="13" font-weight="600" fill="#e2e8f0">Open-Source Engines</text>
      </g>
      <!-- Badge 3 -->
      <g transform="translate(375, 0)">
        <rect width="195" height="38" rx="10" fill="url(#card-grad)" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
        <circle cx="22" cy="19" r="6" fill="#8b5cf6" />
        <text x="36" y="24" font-family="system-ui" font-size="13" font-weight="600" fill="#e2e8f0">Market Intelligence</text>
      </g>
    </g>
  </g>
</svg>
